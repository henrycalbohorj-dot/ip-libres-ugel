<title>Mapa de red 3D · UGEL</title>

<style>
:root{--bg1:#0B1824;--bg2:#02050A;--panel:rgba(8,18,28,.78);--ink:#E3F4FF;--mut:#8FB3C9;--line:rgba(46,197,255,.28);--acc:#2EC5FF;--neon:#2EC5FF;
  --on:#16B876;--off:#8794A2;--dhcp:#3DEBFF;--azul:#2F6FED;--amarillo:#F2B300;--rojo:#E5484D;
  --f-num:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;--f-txt:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,var(--bg1),var(--bg2));color:var(--ink);font:15px/1.4 var(--f-txt);-webkit-tap-highlight-color:transparent}
#escena{position:fixed;inset:0;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.caja{background:linear-gradient(180deg,rgba(10,26,40,.84),rgba(3,11,19,.8));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:3px;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);box-shadow:inset 0 0 24px rgba(46,197,255,.10),inset 0 1px 0 rgba(46,197,255,.35)}

/* Encabezado */
.top{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.marca{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px}
.marca a{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:18px}
.marca h1{margin:0;font:700 19px/1.05 var(--f-num);color:var(--neon);text-shadow:0 0 14px rgba(46,197,255,.65);letter-spacing:.02em}
.tele{margin:3px 0 0;font:500 12px var(--f-num);color:var(--neon);opacity:.85;display:flex;gap:10px}
.tele span+span::before{content:'|';margin-right:10px;opacity:.4}
.marca p{margin:2px 0 0;font-size:12.5px;color:var(--mut)}
.buscar{position:relative;flex:1;max-width:360px;margin-left:auto}
.buscar input{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);backdrop-filter:blur(12px)}
#res{position:absolute;left:0;right:0;top:calc(100% + 6px);list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
#res button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:9px 10px}
#res button:hover,#res button:focus-visible{background:color-mix(in srgb,var(--acc) 12%,transparent)}
#res small{color:var(--mut);font:600 13px var(--f-num);white-space:nowrap}

/* Controles inferiores */
.abajo{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5;width:max-content;max-width:calc(100vw - 24px)}
.pisos{display:flex;gap:4px;padding:5px}
.pisos button{border:0;background:none;border-radius:12px;padding:9px 14px;font-weight:700;color:var(--mut);white-space:nowrap}
.pisos button.on{background:var(--neon);color:#021019;box-shadow:0 0 18px rgba(46,197,255,.55)}
.opciones{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.opc{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700}
.opc input{accent-color:var(--acc);width:16px;height:16px;margin:0}

/* Leyenda */
.leyenda{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom));padding:10px 12px;font-size:12.5px;z-index:4;max-width:220px}
.leyenda b{display:block;font-size:12px;color:var(--mut);margin:0 0 4px}
.leyenda div{display:flex;align-items:center;gap:8px;margin:3px 0}
.leyenda i{display:inline-block;width:18px;height:4px;border-radius:2px;background:var(--c)}
.leyenda i.led{width:10px;height:10px;border-radius:50%}
@media (max-width:900px){.leyenda{display:none}}

/* Panel de detalle */
.panel{position:fixed;right:12px;top:calc(76px + env(safe-area-inset-top));width:330px;max-height:calc(100vh - 190px);overflow:auto;padding:16px;z-index:6}
.panel h2{margin:0 26px 2px 0;font:700 21px/1.15 var(--f-txt)}
.panel .sub{color:var(--mut);font-size:13.5px;margin:0 0 12px}
.panel .ip{font:700 22px var(--f-num);display:flex;align-items:center;gap:8px}
.panel .ip i{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.panel dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:12px 0}
.panel dt{color:var(--mut);font-size:13.5px}.panel dd{margin:0;font-size:14px;word-break:break-word}
.ruta{list-style:none;margin:6px 0 12px;padding:0;position:relative}
.ruta li{position:relative;padding:4px 0 4px 20px;font-size:13.5px}
.ruta li::before{content:"";position:absolute;left:5px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--amarillo)}
.ruta li:not(:last-child)::after{content:"";position:absolute;left:8px;top:19px;bottom:-5px;width:2px;background:var(--amarillo);opacity:.6}
.ruta small{color:var(--mut);font-family:var(--f-num)}
.cerrar{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
.acciones a{flex:1;text-align:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-weight:700;font-size:14px}
.acciones a.pri{background:var(--acc);border-color:var(--acc);color:#fff}
@media (max-width:700px){
  .l-area{font-size:10px}.l-piso{font-size:13px;padding:3px 8px 3px 7px}.l-piso small{font-size:10px;margin-top:2px}.l-dev{font-size:10.5px}
  .panel{left:8px;right:8px;top:auto;bottom:calc(8px + env(safe-area-inset-bottom));width:auto;max-height:52vh;border-radius:20px}
  .marca p{display:none}.marca h1{font-size:16px}
  .top{flex-wrap:wrap}.buscar{max-width:none;flex-basis:100%;order:3}
  .pisos button{padding:8px 10px;font-size:14px}
}
.carga{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:radial-gradient(80% 70% at 50% 40%,rgba(8,30,46,.96),rgba(1,4,8,.98));transition:opacity .7s}
.carga.fuera{opacity:0;pointer-events:none}
.term{font:600 14px/1.5 var(--f-num);color:var(--neon);width:min(560px,86vw);text-shadow:0 0 10px rgba(46,197,255,.5)}
.term p{margin:2px 0;animation:aparece .25s ease-out}.term p::before{content:'› ';opacity:.6}
.term p.ok{color:#7dffc0}.term p.mal{color:#ff7a8a}
.term .cursor{display:inline-block;width:9px;height:16px;background:var(--neon);vertical-align:-3px;animation:parpadeo .8s steps(1) infinite}
@keyframes aparece{from{opacity:0;transform:translateX(-6px)}}@keyframes parpadeo{50%{opacity:0}}

/* Etiquetas 3D */
.l-piso{font:700 20px/1 var(--f-num);color:var(--neon);text-shadow:0 0 10px rgba(46,197,255,.7);background:linear-gradient(90deg,rgba(46,197,255,.22),rgba(4,14,24,.85) 30%);border-left:3px solid var(--neon);padding:6px 14px 6px 10px;white-space:nowrap;pointer-events:none;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);letter-spacing:.06em}
.l-piso b{display:block;font-weight:700}.l-piso small{display:block;margin-top:4px;font:600 11.5px var(--f-num);color:var(--mut);text-shadow:none;letter-spacing:.02em}
.l-piso small em{font-style:normal;color:#7dffc0}
.l-dev,.l-area,.l-piso{transition:opacity .3s}.tapada{opacity:0!important}
@media (max-width:700px){.l-piso{font-size:12.5px;padding:3px 8px 3px 7px;letter-spacing:.03em}.l-piso small{font-size:10px;margin-top:2px}}
.l-area{font:700 12px var(--f-txt);color:var(--ink);opacity:.72;white-space:nowrap;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.7)}
@media (prefers-color-scheme:dark){.l-area{text-shadow:0 1px 2px #000}}
.l-dev{font:600 11.5px var(--f-txt);background:var(--panel);border:1px solid var(--line);padding:2px 7px;border-radius:7px;white-space:nowrap;pointer-events:none;transform:translateY(-14px)}
.l-dev.red{font-family:var(--f-num);background:rgba(2,10,18,.85);color:var(--neon);border-color:rgba(46,197,255,.5)}
.l-dev.sel{background:var(--acc);color:#fff;border-color:var(--acc)}

/* ---------- Fondo futurista ---------- */
#fondo{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#lluvia{position:absolute;inset:0;width:100%;height:100%;opacity:.16;-webkit-mask-image:linear-gradient(to bottom,#000,transparent 75%);mask-image:linear-gradient(to bottom,#000,transparent 75%)}
.rejilla{position:absolute;left:-60%;right:-60%;bottom:-8%;height:52%;transform:perspective(520px) rotateX(70deg);transform-origin:50% 100%;
  background-image:linear-gradient(rgba(46,197,255,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(46,197,255,.28) 1px,transparent 1px);background-size:64px 64px;
  animation:avanza 5s linear infinite;-webkit-mask-image:linear-gradient(to top,#000 25%,transparent);mask-image:linear-gradient(to top,#000 25%,transparent)}
@keyframes avanza{to{background-position:0 64px}}
.sil{position:absolute;filter:drop-shadow(0 0 18px rgba(46,197,255,.45))}
.estrellas{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 18%,#cfefff,transparent),radial-gradient(1px 1px at 72% 12%,#e8d8ff,transparent),radial-gradient(1.5px 1.5px at 38% 8%,#fff,transparent),radial-gradient(1px 1px at 88% 34%,#bfe9ff,transparent),radial-gradient(1px 1px at 22% 42%,#d6c6ff,transparent),radial-gradient(1px 1px at 55% 28%,#fff,transparent),radial-gradient(1.5px 1.5px at 6% 30%,#9fe2ff,transparent),radial-gradient(1px 1px at 94% 8%,#fff,transparent);background-size:420px 300px;opacity:.55;animation:titila 7s ease-in-out infinite alternate}
@keyframes titila{to{opacity:.3}}
.horizonte{position:absolute;left:-10%;right:-10%;bottom:12%;height:30%;background:radial-gradient(60% 55% at 50% 100%,rgba(46,197,255,.18),rgba(122,60,255,.10) 45%,transparent 75%)}
.colectivo{position:absolute;left:0;right:0;bottom:-2vh;width:100%;height:46vh;opacity:.5;filter:drop-shadow(0 0 14px rgba(46,197,255,.35));translate:calc(var(--mx,0) * -18px) calc(var(--my,0) * -8px);
  -webkit-mask-image:linear-gradient(to top,transparent 0,#000 30%);mask-image:linear-gradient(to top,transparent 0,#000 30%)}
.colectivo .lejos{opacity:.35;filter:blur(1.2px)}
.colectivo .ojos{animation:ojos 5s infinite}
@keyframes ojos{0%,92%,100%{opacity:.9}94%{opacity:.15}96%{opacity:.9}}
.hud{position:fixed;inset:10px;pointer-events:none;z-index:2;--b:rgba(46,197,255,.55)}
.hud i{position:absolute;width:34px;height:34px;border:2px solid var(--b)}
.hud i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.hud i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.hud i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.hud i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.glitch{animation:glitch 6s infinite steps(1)}
.glitch.b{animation-delay:-2.7s}
@keyframes glitch{0%,90%,100%{transform:none;clip-path:none}91%{transform:translate(-8px,2px);clip-path:inset(18% 0 58% 0)}92%{transform:translate(6px,-3px);clip-path:inset(62% 0 8% 0)}93%{transform:translate(-4px,0);clip-path:inset(4% 0 82% 0)}94%{transform:translate(3px,1px);clip-path:inset(40% 0 35% 0)}95%{transform:none;clip-path:none}}
.persona{position:absolute;left:50%;top:46%;width:min(70vh,80vw);aspect-ratio:3/4;transform:translate(-50%,-50%);opacity:.26}
.persona img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-mask-image:radial-gradient(closest-side,#000 50%,transparent);mask-image:radial-gradient(closest-side,#000 50%,transparent)}
.persona .p0{filter:grayscale(1) contrast(1.7) brightness(.85)}
.persona .p1{mix-blend-mode:screen;filter:grayscale(1) contrast(1.7) sepia(1) hue-rotate(150deg) saturate(7);opacity:.85;animation:rgb1 2.6s infinite steps(2)}
.persona .p2{mix-blend-mode:screen;filter:grayscale(1) contrast(1.7) sepia(1) hue-rotate(-40deg) saturate(7);opacity:.6;animation:rgb2 3.3s infinite steps(2)}
.persona::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(46,197,255,.18) 0 1px,transparent 1px 4px);-webkit-mask-image:radial-gradient(closest-side,#000 50%,transparent);mask-image:radial-gradient(closest-side,#000 50%,transparent)}
@keyframes rgb1{0%{transform:translate(7px,0)}50%{transform:translate(-3px,2px) skewX(3deg)}}
@keyframes rgb2{0%{transform:translate(-7px,0)}50%{transform:translate(4px,-2px)}}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.vineta{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.65))}
#escena{z-index:1}
@media (max-width:700px){.colectivo{height:30vh;opacity:.38}.persona{opacity:.2}.hud{display:none}}
.aurora{position:absolute;inset:-20%;background:radial-gradient(40% 35% at 25% 30%,rgba(46,197,255,.16),transparent 70%),radial-gradient(35% 30% at 78% 22%,rgba(160,102,255,.16),transparent 70%),radial-gradient(45% 40% at 60% 85%,rgba(20,120,200,.14),transparent 70%);animation:aurora 22s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translate(4%,-3%) rotate(6deg) scale(1.08)}}
.persona{translate:calc(var(--mx,0) * 12px) calc(var(--my,0) * 8px)}
@media (prefers-reduced-motion:reduce){.glitch,.persona img,.aurora,.estrellas,.colectivo .ojos{animation:none!important}}

/* ---------- Modo reposo (TV) ---------- */
.top,.abajo,.zoom,.leyenda,.panel{transition:opacity .7s}
body.reposo .top,body.reposo .abajo,body.reposo .zoom,body.reposo .leyenda,body.reposo .panel{opacity:0;pointer-events:none}
body.reposo{cursor:none}
.tvhud{position:fixed;inset:0;pointer-events:none;z-index:4}
.tvhud>*{opacity:0;transition:opacity 1.4s}
body.reposo .tvhud>*{opacity:1}
.tvmarca{position:absolute;left:clamp(16px,2.4vw,48px);top:clamp(16px,2.4vw,44px);padding:14px 22px 14px 18px;border-left:3px solid var(--neon)}
.tvmarca small{display:block;font:600 clamp(11px,.85vw,16px) var(--f-num);color:var(--mut);letter-spacing:.18em}
.tvmarca b{display:block;font:700 clamp(22px,2.4vw,46px)/1.05 var(--f-num);color:var(--neon);text-shadow:0 0 18px rgba(46,197,255,.7);letter-spacing:.08em;margin:4px 0 6px}
.tvmarca span{font:700 clamp(30px,3.6vw,72px)/1 var(--f-num);color:var(--ink);letter-spacing:.04em}
.tvmarca em{display:block;font:500 clamp(12px,.95vw,18px) var(--f-num);font-style:normal;color:var(--mut);margin-top:4px}
.tvkpi{position:absolute;right:clamp(16px,2.4vw,48px);top:clamp(16px,2.4vw,44px);display:flex;gap:clamp(14px,2vw,40px);padding:16px 24px}
.tvkpi div{text-align:center}.tvkpi b{display:block;font:700 clamp(26px,3vw,60px)/1 var(--f-num);color:var(--neon);text-shadow:0 0 16px rgba(46,197,255,.6)}
.tvkpi div:first-child b{color:#7dffc0;text-shadow:0 0 16px rgba(125,255,192,.5)}.tvkpi div:nth-child(2) b{color:var(--dhcp)}
.tvkpi span{font:600 clamp(11px,.85vw,16px) var(--f-num);color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.tvmsg{position:absolute;left:clamp(16px,2.4vw,48px);bottom:calc(clamp(44px,3.4vw,64px) + clamp(16px,2vw,36px));width:min(620px,42vw);padding:16px 22px 18px;border-left:3px solid var(--c,var(--neon))}
.tvmsg small{display:flex;align-items:center;gap:8px;font:700 clamp(11px,.85vw,16px) var(--f-num);color:var(--c,var(--neon));letter-spacing:.2em}
.tvmsg small::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--neon));box-shadow:0 0 10px var(--c,var(--neon));animation:parpadeo 1.2s steps(1) infinite}
.tvmsg p{margin:8px 0 0;font:600 clamp(17px,1.55vw,32px)/1.3 var(--f-txt);color:var(--ink);min-height:2.6em}
.tvmsg p::after{content:"▌";color:var(--c,var(--neon));animation:parpadeo .8s steps(1) infinite;margin-left:2px}
.ticker{position:absolute;left:0;right:0;bottom:0;height:clamp(44px,3.4vw,64px);overflow:hidden;background:linear-gradient(90deg,rgba(2,10,18,.92),rgba(6,22,36,.8),rgba(2,10,18,.92));border-top:1px solid var(--line);display:flex;align-items:center}
.ticker div{white-space:nowrap;font:600 clamp(15px,1.25vw,26px) var(--f-num);color:var(--ink);padding-left:100%;animation:cinta var(--dur,60s) linear infinite}
.ticker i{font-style:normal;color:var(--neon);margin:0 clamp(18px,2vw,40px)}
@keyframes cinta{to{transform:translateX(-100%)}}
.l-foco{font:700 clamp(13px,1vw,20px) var(--f-num);color:#021019;background:linear-gradient(90deg,#7fe6ff,#2ec5ff);padding:6px 14px;white-space:nowrap;pointer-events:none;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);box-shadow:0 0 22px rgba(46,197,255,.8);transition:opacity .6s}
.l-foco small{display:block;font:600 .75em var(--f-num);opacity:.8}
@media (max-width:700px){.tvkpi,.tvmsg{display:none}}
body.limpio .tvhud,body.limpio .hud{display:none}
@media (prefers-reduced-motion:reduce){.ticker div{animation-duration:0s}}

/* Zoom */
.zoom{position:fixed;right:12px;bottom:calc(120px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:44px;height:44px;border-radius:12px;font:700 22px/1 var(--f-num);display:grid;place-items:center;color:var(--neon)}
.zoom button.chico{font-size:18px}
</style>

    <defs>
      <radialGradient id="cg" cx="50%" cy="80%" r="70%"><stop offset="0" stop-color="#2EC5FF" stop-opacity=".35"/><stop offset="1" stop-color="#2EC5FF" stop-opacity="0"/></radialGradient>

  const q = sinTilde(m.texto).trim(); if (q.length < 3) return;
  const area = d => sinTilde(d.e.areaInv || d.e.area || '');
  const L = [...EQ.values()].filter(d => !['Switch', 'Router'].includes(d.e.tipo));
  const d = L.find(d => area(d).includes(q)) || L.find(d => area(d).length > 3 && q.includes(area(d))) || L.find(d => sinTilde(d.e.area).includes(q));
  if (!d) return;
  if (!FOCO) crearFoco(); d.g.add(FOCO.g); FOCO.t = 0; FOCO.dur = 25;
  FOCO.el.innerHTML = `${esc(m.etiqueta || 'Aviso')}<small>${esc(d.e.areaInv || d.e.area)} · piso ${d.e.piso}</small>`;
  const ah = reloj.elapsedTime; tFoco = ah + 20; tTour = ah + 12;
  volarA(posMundo(d), 16);
});
// En la TV: intenta que la pantalla no se apague y recarga cada 6 horas para mantenerse fresca
if (TV) {
  const wl = () => navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {});
  wl(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wl(); });
  setTimeout(() => location.reload(), 6 * 3600e3);
}

/* ---------- Bucle ---------- */
const reloj = new THREE.Clock(); let intro = QUIETO ? 1 : 0, ultOrden = 0;
function bucle() {
  requestAnimationFrame(bucle);
  const dt = Math.min(reloj.getDelta(), 0.05), t = reloj.elapsedTime;
  // Entrada: los pisos suben a su lugar una sola vez
  if (intro < 1) intro = Math.min(1, intro + dt / 1.4);
  const k = 1 - Math.pow(1 - intro, 3);
  if (Math.abs(sep - sepObj) > 0.01) sep += (sepObj - sep) * Math.min(1, dt * 5);
  for (const [n, g] of PISOS) g.position.y = (n - 1) * sep * k;
  if (intro < 1 || Math.abs(sep - sepObj) > 0.01 || !CABLES[0]?.curva) trazarCables();
  if (vuelo) { vuelo.t = Math.min(1, vuelo.t + dt / 0.9); const e = 1 - Math.pow(1 - vuelo.t, 3);
    camera.position.lerpVectors(vuelo.c0, vuelo.c1, e); controls.target.lerpVectors(vuelo.t0, vuelo.t1, e); if (vuelo.t >= 1) vuelo = null; }
  for (const d of EQ.values()) if (d.g.userData.anillo) d.g.userData.anillo.rotation.z = t * 0.8;
  if (anillo && anillo.parent && !QUIETO) anillo.scale.setScalar(1 + Math.sin(t * 4) * 0.08);
  if (PART) moverParticulas(t);
  animarEfectos(t, dt);
  aplicarZoom(dt);
  controls.update(); renderer.render(scene, camera); etiquetas.render(scene, camera);
  if (t - ultOrden > 0.12) { ultOrden = t; ordenarEtiquetas(); }
  if (!reposo && performance.now() - ultAct > ESPERA * 1000 && $('#carga').classList.contains('fuera')) entrarReposo();
  if (reposo) animarReposo(t, dt);
}

/* ---------- Inicio ---------- */
try {
  const t = await (await fetch('/api/topologia', { cache: 'no-store' })).json();
  if (!t.equipos || !t.equipos.length) throw new Error(t.error || 'Topología vacía');
  linea(`Topología cargada: ${t.equipos.length} equipos, ${t.enlaces.length} cables, ${t.pisos.length} pisos`);
  linea(`Inventario sincronizado: ${t.equipos.filter(e => e.invId).length} equipos con ficha`);
  construir(t); crearParticulas(); crearEfectos(); aplicarPisos(); aplicarNombres();
  linea('Vista 3D lista', 'ok');
  { const { t: tg, c } = encuadre(); controls.target.copy(tg); camera.position.copy(c).add(new THREE.Vector3(0, 6, 8)); vistaGeneral(); }
  bucle(); estado();
  setTimeout(() => { $('#carga').classList.add('fuera'); setTimeout(() => $('#carga').hidden = true, 750); }, QUIETO ? 0 : 1100);
  const q = new URLSearchParams(location.search).get('ip');
  if (q) { const d = [...EQ.values()].find(x => x.e.ip === q); if (d) setTimeout(() => seleccionar(d.e.id), 1500); }
} catch (err) {
  linea('No se pudo cargar el mapa: ' + err.message, 'mal');
}
